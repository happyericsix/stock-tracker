spring.application.name=stocktracker

spring.datasource.url=jdbc:mysql://localhost:3306/stockdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:123456}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.port=

# Caching Configuration
spring.cache.cache-names=stocks,stockOverviews,stockSearch
spring.cache.type=redis

# Logging Configuration
logging.level.com.happyericsix.stocktracker=INFO
logging.level.org.springframework.cache=DEBUG

# Circuit Breaker
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=5
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=3

rsa.private-key=classpath:app.key
rsa.public-key=classpath:app.pub
jwt.expiration=86400000

# Redis Connection
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.min-idle=2
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.max-active=16

# Akshare Python Data Service
akshare.api.base-url=http://localhost:8000

# Internal service-to-service token (Python data service uses this to call /api/v1/internal/**)
internal.api.token=${INTERNAL_API_TOKEN:stock-tracker-internal-2026}
