spring.application.name=stocktracker

spring.datasource.url=jdbc:h2:mem:stockdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=${PORT:8080}

# Caching Configuration - in-memory cache with automatic creation
# Cache names to be created automatically
spring.cache.cache-names=stocks,stockOverviews
spring.cache.type=redis
# spring.cache.redis.time-to-live=30s
# Logging Configuration - show cache activity and service logs
logging.level.com.happyericsix.stocktracker=INFO
logging.level.org.springframework.cache=DEBUG

# Circuit Breaker
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=5
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=3

rsa.private-key=classpath:app.key
rsa.public-key=classpath:app.pub
jwt.expiration=86400000

# Redis Connection
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.min-idle=2
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.max-active=16

# Tencent Finance API
tencent.stock.base.url=http://qt.gtimg.cn
tencent.stock.history.base.url=http://web.ifzq.gtimg.cn

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration


