spring.application.name=stocktracker

alpha.vantage.base.url=https://www.alphavantage.co/query
alpha.vantage.api.key=74UO0AK3TRX4QF8K

spring.datasource.url=jdbc:h2:mem:stockdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=${PORT:8080}

# Caching Configuration - in-memory cache with automatic creation
# Cache names to be created automatically
spring.cache.cache-names=stocks,stockOverviews
spring.cache.type=caffeine
spring.cache.caffeine.spec=expireAfterWrite=30s,maximumSize=500
# Logging Configuration - show cache activity and service logs
logging.level.com.abhinav.stocktracker=INFO
logging.level.org.springframework.cache=DEBUG

# Circuit Breaker ??
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=5
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=3
