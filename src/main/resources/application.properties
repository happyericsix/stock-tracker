spring.application.name=stocktracker

spring.datasource.url=jdbc:mysql://localhost:3306/stockdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:123456}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Caching Configuration（缓存名单唯一出处是 RedisCacheConfig.CACHE_NAMES）
spring.cache.type=redis

# SSE: async request timeout -1 = never time out (SSE long connection)
spring.mvc.async.request-timeout=-1

# Logging Configuration
logging.level.com.happyericsix.stocktracker=INFO

# RSA JWT 密钥：默认读 secrets/ 目录（gitignore，绝不进仓库）。
# 密钥生成：openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out secrets/app.key
#           openssl pkey -in secrets/app.key -pubout -out secrets/app.pub
# 部署时用环境变量指向挂载路径，例如 RSA_PRIVATE_KEY_PATH=file:/run/secrets/app.key。
# ⚠️ 2026-09-21 前仓库 classpath 里曾提交过一对真实密钥并已推送——已轮换并取消跟踪，
#   但 git 历史里仍可翻到旧密钥（如需彻底清除要重写历史 + 强推，单独决定）。
rsa.private-key=${RSA_PRIVATE_KEY_PATH:file:secrets/app.key}
rsa.public-key=${RSA_PUBLIC_KEY_PATH:file:secrets/app.pub}
jwt.expiration=86400000

# Java -> Python 服务间调用共享密钥（生产必须覆盖；与 python-data-service/.env 的 INTERNAL_API_TOKEN 一致）
internal.api-token=${INTERNAL_API_TOKEN:stock-tracker-internal-2026}

# Redis Connection
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.min-idle=2
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.max-active=16

# Akshare Python Data Service
akshare.api.base-url=http://localhost:8000

# 同花顺会话加密密钥（用于 AES/GCM 加密 ths_bindings.session_encrypted）
# 本地随便填，生产必须走环境变量覆盖，且不要提交到 git。
# 注意：改了这里，之前加密存的凭证就解不开了（需要重新扫码）。
ths.aes.key=${THS_AES_KEY:dev-only-key-change-me-0000}

# ---- 资讯时效（NewsRetentionJob 每晚按此清理过期条目）----
# 快讯过期即噪音；宏观/政策有跟踪价值；公告与研报是法定披露与深度参考，留最长
news.retention.flash-days=3
news.retention.macro-days=30
news.retention.policy-days=30
news.retention.geo-days=30
news.retention.opinion-days=7
news.retention.company-days=30
news.retention.earnings-days=30
news.retention.industry-days=30
news.retention.default-days=30
news.retention.disclosure-days=180
