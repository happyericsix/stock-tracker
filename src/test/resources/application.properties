spring.application.name=stocktracker-test

spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update

server.port=0

spring.cache.type=caffeine
spring.cache.caffeine.spec=expireAfterWrite=30s,maximumSize=500
spring.cache.cache-names=stocks,stockOverviews

rsa.private-key=classpath:test-app.key
rsa.public-key=classpath:test-app.pub
jwt.expiration=86400000