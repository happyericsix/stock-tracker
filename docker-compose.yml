services:
  redis:
    image: redis:7-alpine
    container_name: stock-redis
    # 不发布宿主端口：仅内部网络可达（避免 Redis 无口令裸奔到宿主机/外网）
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: stock-mysql
    # 不发布宿主端口：仅内部网络可达
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-123456}
      - MYSQL_DATABASE=stockdb
      - MYSQL_CHARACTER_SET_SERVER=utf8mb4
      - MYSQL_COLLATION_SERVER=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  python-data:
    build: ./python-data-service
    container_name: stock-python-data
    # 不发布宿主端口：只允许 Java 后端经内部网络调用；
    # 服务间鉴权由 INTERNAL_API_TOKEN 保证
    environment:
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN:-stock-tracker-internal-2026}
    restart: unless-stopped

  app:
    build: .
    container_name: stock-tracker
    # 不发布宿主端口：由 frontend(nginx) 在内部网络反代 /api
    environment:
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/stockdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_PASSWORD:-123456}
      - AKSHARE_API_BASE_URL=http://python-data:8000
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN:-stock-tracker-internal-2026}
      # RSA 签名密钥走运行时挂载（镜像内不含密钥）
      - RSA_PRIVATE_KEY_PATH=/run/secrets/app.key
      - RSA_PUBLIC_KEY_PATH=/run/secrets/app.pub
    volumes:
      - ./secrets/app.key:/run/secrets/app.key:ro
      - ./secrets/app.pub:/run/secrets/app.pub:ro
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
      python-data:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: stock-tracker-nginx
    ports:
      - "80:80"
    depends_on:
      - app
    restart: unless-stopped

volumes:
  redis-data:
  mysql-data:
