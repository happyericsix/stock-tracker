account:
  uin: 1121460169
  password: "10203040zym."
  encrypt: false
  status: 0
  relogin:
    delay: 3
    interval: 3
    max-times: 0
  use-sso-address: true
  allow-temp-session: false

heartbeat:
  interval: 5

message:
  post-format: array
  ignore-invalid-cqcode: false
  force-fragment: false
  fix-url: false
  proxy-rewrite: ''
  report-self-message: false
  remove-reply-at: false
  extra-reply-data: false
  online-status: false

output:
  log-level: warn
  log-aging: 15
  log-force-new: true
  log-colorful: true
  debug-source-only: false

default-middlewares: &middlewares
  access-token: ''
  filter: ''
  rate-limit:
    enabled: false
    frequency: 1
    bucket: 1

database:
  leveldb:
    enable: true

servers:
  - ws:
      host: 127.0.0.1
      port: 3003
      middlewares:
        *middlewares

