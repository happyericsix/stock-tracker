# 领域金标集（人审过才能进这里）
#
# 纪律（与 tests/memory_eval/cases.yaml 同源）：
# - expect_direction 必须是**人工确认**的判断，不是 DeepSeek 的输出
#   （拿学生答案当标准答案，评估就只是复读机）。
# - kind: direction = 带方向标签；refusal = 应拒答（信息不足/纯程序性披露）。
# - 每加 10 条人工复核一遍旧的：市场会变（重组完成前后同一公告的方向不同），
#   陈旧金标比没有金标更危险。
#
# 以下前几条是**种子示例**（方向较无争议的公开事件类型），
# 上线评估前请替换/扩充为项目真实资讯的人工审核结果。

- id: seed-001
  kind: direction
  symbol: "600519"
  source: "官方公告"
  title: "公司回购股份方案：拟以自有资金回购1%-2%股份用于注销"
  content: "回购资金总额不低于10亿元且不超过20亿元，回购期限12个月内，回购股份将依法予以注销并减少注册资本。"
  expect_direction: "利好"

- id: seed-002
  kind: direction
  symbol: "600519"
  source: "官方公告"
  title: "控股股东减持计划：拟减持不超过公司总股本3%的股份"
  content: "控股股东计划自公告之日起15个交易日后的六个月内，以集中竞价或大宗交易方式减持。"
  expect_direction: "利空"

- id: seed-003
  kind: direction
  symbol: "000001"
  source: "官方公告"
  title: "收到中国证监会立案告知书"
  content: "因涉嫌信息披露违法违规，根据证券法等法律法规，证监会决定对公司立案调查。"
  expect_direction: "利空"

- id: seed-004
  kind: refusal
  symbol: "600519"
  source: "官方公告"
  title: "关于完成工商变更登记的公告"
  content: "公司注册资本工商变更登记手续已办理完毕，取得新的营业执照。"
  # 程序性披露：无方向性影响，正确行为是"不判断方向"，而不是硬给一个中性

- id: seed-005
  kind: refusal
  symbol: "300750"
  source: "媒体"
  title: "市场传闻公司与某车企洽谈合作"
  content: "有市场消息称，据知情人士透露，公司或将获得重大订单，具体情况尚不清楚。"
  # 传闻 + 无实质内容：必须拒答而不是顺着传闻给"利好"
