[pytest]
# 只从 tests/ 收集用例。
#
# 为什么必须写这一行：包根目录另有 12 个 test_*.py，它们是**手工验证脚本**而不是测试
#   - 全部 0 个 test 函数，靠 print 输出
#   - 其中 5 个会发真实网络请求
#   - test_compare.py 在导入时就 sys.exit(1)
# 没有这一行时，裸跑 `pytest` 会把这些脚本当测试模块导入并执行顶层代码，
# 直接以 INTERNALERROR 崩掉（实测：no tests collected in 11.07s）。
# 这些脚本本身是有用的（README 与 ths_client.py 都引用它们），所以选择限定收集范围而不是删除。
#
# 跑法：pytest          → 只跑 tests/ 下的 45 个用例
#      pytest tests -q → 同上
testpaths = tests
